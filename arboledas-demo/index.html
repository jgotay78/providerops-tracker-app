<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arboledas Smart Table Demo</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5efe5;color:#241a16}header{background:#174a37;color:#fff;padding:16px;position:sticky;top:0}.wrap{max-width:900px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.tabs button{background:#fff}.tabs .on,.btn{background:#174a37;color:#fff}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card,.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px #0001}.food{height:120px;border-radius:12px;background:linear-gradient(135deg,#c9942f,#9c392c);display:flex;align-items:end;padding:10px;color:#fff;font-size:18px;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#74665e;font-size:13px}.cartitem{border-top:1px solid #eadfce;padding:10px 0}.status{font-size:12px;background:#eee1c9;padding:4px 7px;border-radius:999px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:650px;margin:auto;padding:18px;border-radius:20px 20px 0 0}.opt{display:block;padding:7px 0}select,textarea{font:inherit;padding:8px;border-radius:10px;border:1px solid #ccc;width:100%}</style></head><body><header><b>🌵 Arboledas Smart Table — Interactive Demo</b></header><div class="wrap"><div class="tabs"><button class="on" data-v="customer">Customer</button><button data-v="server">Server</button><button data-v="kitchen">Kitchen</button><button data-v="manager">Manager</button></div><section id="customer" class="view on"><div class="panel"><label>Table <select id="table"><option>4</option><option>7</option><option selected>12</option><option>18</option></select></label><p><button class="btn" id="refill">Request refill</button> <button class="btn" id="help">Request server</button></p></div><h2>Menu</h2><div class="grid" id="menu"></div><div class="panel" style="margin-top:14px"><div class="row"><h2>Your order</h2><b id="total">$0.00</b></div><div id="cart"><p class="muted">Nothing added yet.</p></div><p><button class="btn" id="send">Send to kitchen</button> <button class="btn" id="readyPay">Ready to pay</button> <button class="btn" id="pay">Pay on phone</button></p><p id="msg"></p></div></section><section id="server" class="view"><h2>Server floor</h2><div id="serverBox" class="grid"></div></section><section id="kitchen" class="view"><h2>Kitchen queue</h2><div id="kitchenBox" class="grid"></div></section><section id="manager" class="view"><h2>Manager dashboard</h2><div class="panel"><p><b>Orders:</b> <span id="ordersCount">0</span></p><p><b>Audit log</b></p><div id="audit" class="muted">No activity yet.</div></div></section></div><div class="modal" id="modal"><div class="sheet"><div class="row"><h2 id="mt">Customize</h2><button id="close">Close</button></div><label class="opt">Tortilla<select id="tort"><option>Flour</option><option>Corn</option></select></label><label class="opt"><input type="checkbox" value="No onions"> No onions</label><label class="opt"><input type="checkbox" value="No sour cream"> No sour cream</label><label class="opt"><input type="checkbox" value="No cilantro"> No cilantro</label><label class="opt"><input type="checkbox" value="Extra cheese +$1.50" data-extra="1.5"> Extra cheese +$1.50</label><label class="opt">Special instructions<textarea id="notes" rows="2"></textarea></label><p><button class="btn" id="add">Add to order</button></p></div></div><script>const items=[['Quesabirrias',15.99],['Chicken Fajitas',16.99],['Quesadillas Al Carbon',13.99],['Table Side Guacamole',10.99]];let cart=[],orders=[],requests=[],logs=[],sel=null;const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];function money(n){return'$'+n.toFixed(2)}function say(t){$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',2200)}function log(t){logs.unshift(new Date().toLocaleTimeString()+' — '+t);render()}function renderMenu(){$('#menu').innerHTML=items.map((x,i)=>`<div class="card"><div class="food">${x[0]}</div><div class="row"><b>${x[0]}</b><b>${money(x[1])}</b></div><p class="muted">Tap to customize before sending.</p><button class="btn cust" data-i="${i}">Customize</button></div>`).join('');$$('.cust').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;$('#mt').textContent='Customize '+items[sel][0];$('#modal').classList.add('on')})}function render(){if(!cart.length)$('#cart').innerHTML='<p class="muted">Nothing added yet.</p>';else $('#cart').innerHTML=cart.map((x,i)=>`<div class="cartitem"><b>${x.name}</b> ${money(x.price)}<div class="muted">${x.mods.join(' • ')} ${x.notes||''}</div><button data-i="${i}" class="rm">Remove</button></div>`).join('');$('#total').textContent=money(cart.reduce((s,x)=>s+x.price,0));$('.rm')&&$$('.rm').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);render()});$('#serverBox').innerHTML=requests.map(r=>`<div class="card"><b>Table ${r.table}</b><p>${r.type}</p><button class="done" data-id="${r.id}">Handled</button></div>`).join('')+orders.map(o=>`<div class="card"><div class="row"><b>Table ${o.table}</b><span class="status">${o.status}</span></div><p>${o.items.length} item(s) • ${money(o.total)}</p>${o.payAlert?'<b>💳 Ready to pay</b>':''}</div>`).join('')||'<p>No activity.</p>';$$('.done').forEach(b=>b.onclick=()=>{requests=requests.filter(r=>r.id!=b.dataset.id);log('Server handled request')});$('#kitchenBox').innerHTML=orders.filter(o=>o.status!='paid').map(o=>`<div class="card"><b>Table ${o.table}</b><p>${o.items.map(i=>i.name).join('<br>')}</p><span class="status">${o.status}</span><p>${o.status==='NEW'?`<button class="btn start" data-id="${o.id}">Start cooking</button>`:o.status==='COOKING'?`<button class="btn ready" data-id="${o.id}">Mark ready</button>`:''}</p></div>`).join('')||'<p>No kitchen tickets.</p>';$$('.start').forEach(b=>b.onclick=()=>{orders.find(o=>o.id==b.dataset.id).status='COOKING';log('Kitchen started order')});$$('.ready').forEach(b=>b.onclick=()=>{orders.find(o=>o.id==b.dataset.id).status='READY';log('Kitchen marked order ready')});$('#ordersCount').textContent=orders.length;$('#audit').innerHTML=logs.length?logs.join('<br>'):'No activity yet.'}$('#close').onclick=()=>$('#modal').classList.remove('on');$('#add').onclick=()=>{let p=items[sel][1],mods=[$('#tort').value+' tortilla'];$$('#modal input:checked').forEach(c=>{mods.push(c.value);p+=+(c.dataset.extra||0)});cart.push({name:items[sel][0],price:p,mods,notes:$('#notes').value});$('#modal').classList.remove('on');$('#notes').value='';$$('#modal input').forEach(c=>c.checked=false);render();say('Added to order ✅')};$('#send').onclick=()=>{if(!cart.length)return say('Add an item first.');let table=$('#table').value,total=cart.reduce((s,x)=>s+x.price,0);orders.unshift({id:Date.now(),table,items:JSON.parse(JSON.stringify(cart)),total,status:'NEW',payAlert:false});cart=[];log('Table '+table+' sent order to kitchen');say('Order sent ✅')};function req(type){let table=$('#table').value;requests.unshift({id:Date.now(),table,type});log('Table '+table+' requested '+type);say(type+' request sent')};$('#refill').onclick=()=>req('Refill');$('#help').onclick=()=>req('Server');$('#readyPay').onclick=()=>{let t=$('#table').value,o=orders.find(o=>o.table==t&&o.status!='paid');if(!o)return say('No open order.');o.payAlert=true;log('Table '+t+' ready to pay');say('Server notified 💳')};$('#pay').onclick=()=>{let t=$('#table').value,o=orders.find(o=>o.table==t&&o.status!='paid');if(!o)return say('No open order.');o.status='paid';o.payAlert=false;log('Table '+t+' simulated mobile payment');say('Payment complete ✅')};$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on');render()});renderMenu();render();</script></body></html>
