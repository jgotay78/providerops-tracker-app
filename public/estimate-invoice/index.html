<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f73">
<title>Estimate, Invoice & Client Manager</title>
<style>
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;color:#172033}
  .loader{min-height:100vh;display:grid;place-items:center;padding:24px}
  .loader-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 14px 42px rgba(23,32,51,.12);text-align:center}
  .icon{width:70px;height:70px;margin:0 auto 14px;border-radius:20px;background:#087f73;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900}
  h1{font-size:21px;margin:0 0 7px}.small{font-size:13px;color:#687386}.error{color:#b64040;white-space:pre-wrap}
</style>
</head>
<body>
<div class="loader"><div class="loader-card">
  <div class="icon">Q+</div>
  <h1>Estimate, Invoice & Client Manager</h1>
  <div id="status" class="small">Opening your business tool…</div>
</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const files=["./source/part01.txt","./source/part02.txt","./source/part03.txt","./source/part04.txt","./source/part05.txt","./source/part06.txt","./source/part07.txt","./source/part08.txt","./source/part09.txt","./source/part10.txt","./source/part11.txt","./source/part12.txt","./source/part13.txt","./source/part14.txt","./source/part15.txt","./source/part16.txt","./source/part17.txt","./source/part18.txt"];
    const pieces=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-cache'});
      if(!r.ok) throw new Error('Could not load '+f);
      return r.text();
    }));
    let source=pieces.join('\n');

    source=source.replace(
      'English Estimate, Invoice &amp; Client Manager — LAYOUT REVIEW (NOT FINAL)',
      'Estimate, Invoice &amp; Client Manager'
    );
    source=source.replace(
      'ENGLISH-ONLY SIGNABLE HTML WORKFLOW PREVIEW · NOT FINAL',
      'ENGLISH EDITION · ESTIMATE + INVOICE + CLIENT MANAGER'
    );

    const mobileHead=`
<meta name="theme-color" content="#087f73"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Estimate Manager"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<style id="mobile-webapp-overrides">
  html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{width:100%;max-width:100%;overflow-x:hidden}
  .topbar{color:#fff!important}
  .brand h1{color:#fff!important}
  .brand p{color:rgba(255,255,255,.88)!important}
  .edition-note{color:rgba(255,255,255,.78)!important}

  @media(max-width:900px){
    input,select,textarea{font-size:16px!important}
    .toolbar .btn,.top-actions .btn{min-height:44px}
    .modal-backdrop{padding:10px!important}
  }

  @media(max-width:720px){
    .app-shell{width:calc(100% - 16px)!important;margin:8px auto 28px!important}
    .topbar{
      flex-direction:column!important;
      align-items:stretch!important;
      gap:14px!important;
      padding:16px!important;
      border-radius:18px 18px 12px 12px!important;
    }
    .brand{
      width:100%!important;
      flex-direction:row!important;
      align-items:flex-start!important;
      gap:11px!important;
    }
    .brand>div:last-child{min-width:0!important;flex:1 1 auto!important}
    .brand-mark{
      width:46px!important;height:46px!important;flex:0 0 46px!important;
      font-size:17px!important;background:rgba(255,255,255,.20)!important;
      border-color:rgba(255,255,255,.48)!important;color:#fff!important;
    }
    .brand h1{
      font-size:22px!important;
      line-height:1.12!important;
      margin:1px 0 0!important;
      overflow-wrap:anywhere!important;
    }
    .edition-note{
      font-size:10px!important;
      line-height:1.35!important;
      letter-spacing:.055em!important;
      margin:6px 0 3px!important;
    }
    .brand p{font-size:13px!important;line-height:1.4!important;margin-top:5px!important}
    .top-actions{width:100%!important;justify-content:stretch!important}
    .top-actions .btn{width:100%!important}
    .language-switch{display:none!important}

    .toolbar{
      width:100%!important;
      display:grid!important;
      grid-template-columns:repeat(2,minmax(0,1fr))!important;
      gap:8px!important;
      overflow:visible!important;
      padding:10px 0 14px!important;
    }
    .toolbar .btn{
      width:100%!important;
      min-width:0!important;
      white-space:normal!important;
      line-height:1.2!important;
      font-size:12px!important;
      padding:9px 8px!important;
      text-align:center!important;
    }

    .workspace{grid-template-columns:1fr!important}
    .card-header{padding:14px 13px 11px!important}
    .totals-strip{grid-template-columns:1fr 1fr!important;gap:7px!important}
    #quoteDocument{margin:4px!important;padding:16px 12px!important;max-width:100%!important;overflow-wrap:anywhere}
    .items-table{min-width:620px}
    .items-table-wrap,.table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
    .modal-backdrop{padding:8px!important;align-items:flex-end!important}
    .modal-panel,.modal-card,.modal{
      width:100%!important;max-width:100%!important;max-height:94dvh!important;
      border-radius:18px 18px 8px 8px!important;overflow-y:auto!important
    }
    button{touch-action:manipulation}
  }

  @media(max-width:430px){
    .app-shell{width:calc(100% - 12px)!important;margin-top:6px!important}
    .topbar{padding:14px!important}
    .brand-mark{width:42px!important;height:42px!important;flex-basis:42px!important}
    .brand h1{font-size:20px!important}
    .brand p{font-size:12px!important}
    .toolbar{grid-template-columns:1fr 1fr!important;gap:7px!important}
    .toolbar .btn{font-size:11.5px!important;padding:8px 6px!important}
  }
</style>`;
    source=source.replace('</head>',mobileHead+'\n</head>');

    const sw=`<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    const toolbar=document.querySelector('.toolbar');
    if(toolbar) toolbar.scrollLeft=0;
  });
}
<\/script>`;
    source=source.replace('</body>',sw+'\n</body>');

    document.open();
    document.write(source);
    document.close();
  }catch(err){
    status.className='small error';
    status.textContent='The app could not finish loading. Please refresh the page.\n'+(err?.message||err);
  }
})();
</script>
</body>
</html>
